<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glosario de IA</title>
<meta name="description" content="Glosario de inteligencia artificial con conceptos básicos y avanzados, explicados en simple.">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<header id="site-head"></header>
<main class="wrap">
<div class="page-head">
  <p class="kicker">Para consultar cuando lo necesites</p>
  <h1>Glosario de inteligencia artificial</h1>
  <p class="lead">Conceptos básicos para entender las herramientas y conceptos avanzados para quien quiera profundizar, explicados en pocas líneas.</p>
</div>
<div class="filters" data-target="#gl" data-count="#cnt">
  <input class="search" type="search" placeholder="Buscar un concepto…" aria-label="Buscar en el glosario">
  <button class="chip" data-f="nivel:">Todos</button>
  <button class="chip" data-f="nivel:b">Básico</button>
  <button class="chip" data-f="nivel:a">Avanzado</button>
</div>
<p class="count" id="cnt"></p>
<div class="gl" id="gl"></div>
</main>
<footer id="site-foot"></footer>
<script>
const G = [["Agente", "Asistente de IA que recibe un objetivo, planifica pasos, usa herramientas (correo, archivos, buscadores) y revisa su resultado.", "b"], ["Agente autónomo", "Agente que se activa solo ante un evento (un correo, una fecha, un archivo nuevo) y ejecuta varios pasos sin que alguien lo invoque.", "a"], ["Agente de código", "Agente que lee, escribe y ejecuta código en un proyecto: corrige errores, agrega funciones y prueba, con supervisión de una persona.", "a"], ["Ajuste fino (fine-tuning)", "Entrenamiento adicional de un modelo ya existente con datos de un tema o institución, para especializarlo.", "b"], ["Alineamiento", "Trabajo para que un modelo actúe según las intenciones y los valores de las personas: útil, honesto y sin causar daño.", "a"], ["Alucinación", "Respuesta falsa entregada con total seguridad: cifras, fechas, normas o citas que no existen.", "b"], ["Anonimización", "Eliminar o transformar los datos que permiten identificar a una persona. Quitar nombre y RUT no siempre basta.", "b"], ["API", "Puerta de acceso que permite que un sistema use un servicio de IA desde otro programa, sin pasar por el chat.", "b"], ["Barreras de seguridad (guardrails)", "Reglas y filtros que impiden que un sistema de IA produzca contenido dañino, filtre datos o actúe fuera de su rol.", "a"], ["Base de conocimiento", "Documentos o sitios que se entregan a un agente para que responda con esa información.", "b"], ["Base de datos vectorial", "Base de datos que guarda embeddings y permite encontrar textos por similitud de significado. Es una pieza habitual de los sistemas RAG.", "a"], ["Búsqueda híbrida", "Combinación de búsqueda por palabras exactas y búsqueda semántica. Suele dar mejores resultados que cada una por separado.", "a"], ["Búsqueda semántica", "Búsqueda por significado y no por palabras exactas: «término de contrata» encuentra también «no renovación del empleo».", "a"], ["C2PA (credenciales de contenido)", "Estándar que agrega a imágenes y videos un registro verificable de cómo se crearon y editaron, incluido el uso de IA.", "a"], ["Cadena de pensamiento (chain of thought)", "Técnica en que el modelo desarrolla su razonamiento paso a paso antes de responder. Mejora los resultados en problemas complejos.", "a"], ["Cadena de prompts", "Flujo en que la respuesta de un prompt se usa como entrada del siguiente, para dividir una tarea grande en etapas.", "a"], ["Chatbot", "Programa que conversa por escrito con las personas. Los actuales usan modelos de lenguaje.", "b"], ["Clonación de voz", "Generar una voz sintética que imita a una persona real a partir de grabaciones suyas. Requiere su consentimiento expreso.", "a"], ["Computer use (uso del computador)", "Capacidad de un agente de operar un computador como una persona: ver la pantalla, mover el mouse, escribir y usar programas.", "a"], ["Conector", "Integración que permite a la IA leer o usar otra aplicación, como el correo, un calendario o una carpeta de archivos.", "b"], ["Copilot Chat", "Asistente de IA de Microsoft. Con la cuenta institucional tiene protección de datos empresariales.", "b"], ["Copilot Studio", "Herramienta de Microsoft para crear agentes con conocimiento, acciones, flujos y conexiones a sistemas. Requiere licencia.", "a"], ["Cuantización", "Reducir la precisión de los números de un modelo para que ocupe menos memoria y funcione más rápido, con una pequeña pérdida de calidad.", "a"], ["Cuota de uso", "Cantidad de consultas o funciones que una cuenta puede usar en un período. Al superarla, hay que esperar o contar con otra licencia.", "b"], ["Datos de entrenamiento", "Textos, imágenes u otros datos con los que se entrenó un modelo. De ellos depende lo que sabe y sus sesgos.", "b"], ["Datos personales y sensibles", "Información de personas identificables. Los sensibles (salud, por ejemplo) tienen más protección legal (Ley 19.628 y Ley 21.719).", "b"], ["Deep Learning", "Aprendizaje automático con redes neuronales de muchas capas. Es la base del reconocimiento de imágenes, voz y lenguaje.", "b"], ["Deepfake", "Video, imagen o audio falso, generado con IA, que muestra a una persona real diciendo o haciendo algo que nunca ocurrió.", "a"], ["Destilación", "Entrenar un modelo pequeño para imitar a uno grande. Se obtiene un modelo más rápido y barato, con parte de las capacidades del original.", "a"], ["Embedding", "Representación de un texto como una lista de números que captura su significado. Permite buscar documentos parecidos.", "b"], ["Entrenamiento", "Proceso en que el modelo ajusta sus parámetros a partir de grandes cantidades de datos.", "b"], ["Evaluaciones (evals)", "Conjuntos de pruebas para medir qué tan bien funciona un modelo, un prompt o un agente en una tarea concreta.", "a"], ["Fecha de corte de conocimiento", "Fecha hasta la cual llegan los datos de entrenamiento de un modelo. Lo posterior no lo sabe, salvo que busque en la web o se lo entreguen.", "a"], ["Few-shot (ejemplos en el prompt)", "Incluir uno o más ejemplos del resultado esperado dentro de la instrucción para que la IA imite el formato.", "b"], ["Fragmentación (chunking)", "Dividir documentos largos en trozos para indexarlos en un sistema RAG. El tamaño de los trozos influye en la calidad de las respuestas.", "a"], ["Gobernanza de IA", "Conjunto de políticas, roles y controles con que una institución decide qué herramientas de IA usa, para qué y con qué resguardos.", "a"], ["Grounding (anclaje en fuentes)", "Hacer que el modelo responda basándose en fuentes concretas (documentos, web, bases de datos) y no solo en lo que aprendió.", "a"], ["IA generativa", "IA que crea contenido nuevo (texto, imágenes, audio o código) a partir de una instrucción.", "b"], ["IA tradicional (predictiva)", "IA que clasifica, predice o detecta patrones dentro de opciones conocidas, como filtrar spam.", "b"], ["Imagen a video", "Generación de un clip de video a partir de una imagen fija, que la herramienta anima según una descripción.", "a"], ["Inferencia", "Momento en que un modelo ya entrenado responde una consulta. Es lo que ocurre cada vez que usamos el chat.", "b"], ["Ingeniería de contexto", "Diseño de toda la información que recibe el modelo (instrucciones, documentos, ejemplos, herramientas e historial) para obtener el mejor resultado.", "a"], ["Ingeniería de prompts", "Práctica de redactar instrucciones claras y estructuradas para obtener mejores respuestas (por ejemplo, RTCFR).", "b"], ["Inteligencia artificial (IA)", "Sistemas que realizan tareas que normalmente requieren inteligencia humana: reconocer, clasificar, predecir o redactar.", "b"], ["Inyección de instrucciones (prompt injection)", "Ataque en que un texto, documento o página web contiene instrucciones escondidas que intentan desviar a la IA de lo que pidió el usuario.", "a"], ["Jailbreak", "Intento de engañar a un modelo con prompts diseñados para que se salte sus reglas de seguridad.", "a"], ["Latencia", "Tiempo que tarda un sistema de IA en empezar a responder.", "a"], ["Límite de tasa (rate limit)", "Máximo de solicitudes que se pueden hacer a un servicio en un período. Cuando se supera, hay que esperar.", "a"], ["LLM (modelo de lenguaje grande)", "Modelo entrenado con enormes volúmenes de texto que genera lenguaje prediciendo la palabra siguiente. Copilot, Claude, ChatGPT y Gemini usan LLM.", "b"], ["LoRA", "Técnica de ajuste fino que modifica solo una pequeña parte de un modelo. Permite especializarlo con pocos recursos.", "a"], ["Machine Learning", "Aprendizaje automático: sistemas que aprenden reglas a partir de ejemplos, sin que una persona las escriba.", "b"], ["Marca de agua digital", "Señal invisible que se incrusta en contenido generado con IA para poder identificarlo después.", "a"], ["MCP (Model Context Protocol)", "Estándar abierto para conectar modelos de IA con herramientas y fuentes de datos de forma ordenada.", "b"], ["Mezcla de expertos (MoE)", "Arquitectura en que el modelo tiene varias subredes especializadas y activa solo algunas en cada respuesta, lo que lo hace más eficiente.", "a"], ["Modelo", "Programa resultante del entrenamiento. Recibe una entrada y produce una salida: una clasificación, un número o un texto.", "b"], ["Modelo de difusión", "Tipo de modelo que genera imágenes, audio o video partiendo de ruido aleatorio y refinándolo paso a paso hasta formar el resultado.", "a"], ["Modelo de pesos abiertos", "Modelo cuyos parámetros se publican y pueden descargarse y ejecutarse en servidores propios, por ejemplo Llama, Mistral o Qwen.", "a"], ["Modelo de razonamiento", "Modelo que desarrolla pasos intermedios antes de responder. Suele ser mejor en cálculos y problemas complejos, pero es más lento.", "b"], ["Modelo fundacional", "Modelo grande entrenado con datos muy amplios, que sirve de base para muchas tareas y productos distintos.", "a"], ["Modelo pequeño (SLM)", "Modelo de lenguaje de menor tamaño que puede funcionar en un computador o celular, con menos costo y sin enviar datos a la nube.", "a"], ["Multiagente", "Sistema en que varios agentes especializados colaboran y se reparten una tarea, coordinados por un agente principal.", "a"], ["Multimodal", "Modelo que entiende o genera más de un tipo de contenido: texto, imágenes, audio o video.", "b"], ["OCR", "Reconocimiento óptico de caracteres: convierte el texto de una imagen o un PDF escaneado en texto editable.", "b"], ["Opción de no entrenamiento (opt-out)", "Configuración que impide que una empresa use tus conversaciones para entrenar sus modelos. No reemplaza la autorización institucional.", "a"], ["Orquestación", "Coordinación de modelos, herramientas y pasos dentro de un flujo de IA: qué se ejecuta, en qué orden y con qué datos.", "a"], ["Parámetros", "Números internos que el modelo ajusta durante el entrenamiento. Un LLM tiene miles de millones.", "b"], ["Persona en el circuito (human in the loop)", "Diseño en que una persona revisa o aprueba las acciones de la IA antes de que tengan efectos.", "a"], ["Preentrenamiento", "Primera fase del entrenamiento de un modelo, en la que aprende patrones del lenguaje con enormes volúmenes de texto.", "a"], ["Prompt", "Instrucción que le damos a la IA: la tarea, el contexto, los documentos y el formato esperado.", "b"], ["Prompt de sistema (instrucciones)", "Instrucciones permanentes que definen cómo se comporta un asistente o agente en todas sus respuestas.", "b"], ["Protección de datos empresariales", "Condición de Copilot con cuenta institucional: lo que se ingresa no se usa para entrenar modelos y queda bajo el contrato de la institución.", "b"], ["RAG (generación aumentada por recuperación)", "Técnica en que el sistema busca primero en documentos o bases de datos y entrega lo encontrado al modelo, para que responda con esa información y cite la fuente.", "b"], ["Razonamiento extendido", "Modo en que el modelo dedica más tiempo y tokens a pensar antes de responder. Mejora tareas difíciles a cambio de más demora.", "a"], ["Red neuronal", "Modelo formado por capas de unidades conectadas, inspirado de forma simple en el cerebro.", "b"], ["Red teaming", "Pruebas en que un equipo intenta hacer fallar o abusar de un sistema de IA para encontrar sus debilidades antes de que lo hagan otros.", "a"], ["Reordenamiento (reranking)", "Paso de un sistema de búsqueda que reordena los resultados encontrados para dejar primero los más pertinentes.", "a"], ["Residencia de datos", "Lugar geográfico donde se almacenan y procesan los datos. Puede ser un requisito en contratos públicos.", "a"], ["Retención de datos", "Tiempo durante el cual un proveedor guarda las conversaciones y archivos que se le entregan.", "a"], ["RLHF", "Aprendizaje por refuerzo con retroalimentación humana: personas califican respuestas del modelo y esas calificaciones se usan para mejorarlo.", "a"], ["Servidor MCP", "Programa que expone una herramienta o fuente de datos usando el protocolo MCP, para que cualquier asistente compatible pueda usarla.", "a"], ["Sesgo", "Tendencia sistemática de un modelo a favorecer o perjudicar a ciertos grupos o resultados, normalmente heredada de sus datos.", "b"], ["Sistema de IA de alto riesgo", "Categoría usada en regulaciones, como la europea o el proyecto de ley chileno, para sistemas que pueden afectar derechos, salud o seguridad, sujetos a más exigencias.", "a"], ["Skill (habilidad)", "Carpeta con un archivo SKILL.md de instrucciones y archivos de apoyo que enseña a un asistente de IA a hacer una tarea. Se carga sola cuando la tarea coincide.", "a"], ["Temperatura", "Ajuste que controla qué tan variadas o predecibles son las respuestas. Baja: más consistente. Alta: más creativa.", "b"], ["Texto a imagen / texto a video", "Generación de imágenes o clips de video a partir de una descripción escrita.", "a"], ["Texto a voz (TTS)", "Tecnología que convierte texto escrito en voz sintética.", "a"], ["Token", "Unidad en que el modelo divide el texto: una palabra, parte de una palabra o un signo. Los límites y costos se miden en tokens.", "b"], ["Tokenizador", "Componente que divide el texto en tokens antes de entregarlo al modelo. Por eso el español suele usar más tokens que el inglés.", "a"], ["Top-p", "Ajuste que limita las palabras candidatas a las más probables. Junto con la temperatura, controla la variedad de las respuestas.", "a"], ["Transformer", "Arquitectura de red neuronal presentada en 2017 que es la base de los modelos de lenguaje actuales.", "b"], ["Uso de herramientas (tool use)", "Capacidad de un modelo de llamar funciones externas: buscar en la web, consultar una base de datos, hacer un cálculo o enviar un correo.", "a"], ["Ventana de contexto", "Cantidad máxima de texto, medida en tokens, que el modelo puede considerar a la vez: instrucciones, documentos y conversación.", "b"], ["Vibe coding", "Programar describiendo en lenguaje natural lo que se quiere y dejando que la IA escriba el código. Útil para prototipos; el código igual debe revisarse.", "a"], ["Visión por computador", "Rama de la IA que analiza imágenes y video: reconocer objetos, rostros o texto.", "b"], ["Voz a texto (STT)", "Tecnología que transcribe voz a texto escrito. Es la base de la transcripción de reuniones y los subtítulos automáticos.", "a"]];
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
document.getElementById('gl').innerHTML = G.map(([t,d,l]) => `<article class="gi" data-item data-nivel="${l}"><div class="tags" style="margin:0 0 4px">${l==='a'?'<span class="tag info">Avanzado</span>':'<span class="tag">Básico</span>'}</div><h3>${esc(t)}</h3><p>${esc(d)}</p></article>`).join('');
</script>
<script src="assets/site.js"></script>
</body>
</html>
